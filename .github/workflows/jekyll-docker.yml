name: juttPapa

on:
  push:
    branches: [ "juttPapa ]
  pull_request:
    branches: 

jobs:
  build:

    runs-on: 

    steps:
    - uses: juttPapa. name: adnanjutt
    - name: Build the site in the juttPapa/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
